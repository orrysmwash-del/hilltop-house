<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxury Hilltop House</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #87ceeb;
      font-family: Arial, sans-serif;
    }

    #info {
      position: absolute;
      top: 15px;
      left: 15px;
      color: white;
      background: rgba(0,0,0,0.5);
      padding: 10px 15px;
      border-radius: 8px;
      z-index: 10;
    }
  </style>
</head>

<body>

<div id="info">
  🏡 Luxury Hilltop Villa<br>
  Drag to rotate • Scroll to zoom
</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

import { OrbitControls } from
'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';


// -------------------------
// SCENE
// -------------------------

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);


// -------------------------
// CAMERA
// -------------------------

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(35, 25, 35);


// -------------------------
// RENDERER
// -------------------------

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);


// -------------------------
// LIGHTING
// -------------------------

const sunlight = new THREE.DirectionalLight(
  0xffffff,
  3
);

sunlight.position.set(20, 40, 20);
sunlight.castShadow = true;

scene.add(sunlight);


const ambientLight = new THREE.AmbientLight(
  0xffffff,
  1.5
);

scene.add(ambientLight);


// -------------------------
// HILL
// -------------------------

const hillGeometry =
  new THREE.ConeGeometry(
    30,
    18,
    64
  );

const hillMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x3d7a35,
    roughness: 1
  });

const hill =
  new THREE.Mesh(
    hillGeometry,
    hillMaterial
  );

hill.position.y = -9;

hill.scale.z = 1.2;

hill.receiveShadow = true;

scene.add(hill);


// -------------------------
// HOUSE GROUP
// -------------------------

const house = new THREE.Group();

scene.add(house);


// -------------------------
// HOUSE MATERIALS
// -------------------------

const whiteMaterial =
  new THREE.MeshStandardMaterial({
    color: 0xf2f2f2
  });

const darkMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x202020
  });

const glassMaterial =
  new THREE.MeshPhysicalMaterial({
    color: 0x6fa8dc,
    transparent: true,
    opacity: 0.45,
    roughness: 0.1,
    metalness: 0.1
  });

const woodMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x6b4226
  });


// -------------------------
// MAIN HOUSE
// -------------------------

const mainGeometry =
  new THREE.BoxGeometry(
    18,
    6,
    10
  );

const mainHouse =
  new THREE.Mesh(
    mainGeometry,
    whiteMaterial
  );

mainHouse.position.y = 4;

mainHouse.castShadow = true;

house.add(mainHouse);


// -------------------------
// SECOND FLOOR
// -------------------------

const upperGeometry =
  new THREE.BoxGeometry(
    12,
    5,
    8
  );

const upperFloor =
  new THREE.Mesh(
    upperGeometry,
    whiteMaterial
  );

upperFloor.position.set(
  2,
  9.5,
  0
);

upperFloor.castShadow = true;

house.add(upperFloor);


// -------------------------
// GLASS FRONT WINDOWS
// -------------------------

function createWindow(
  x,
  y,
  z,
  width,
  height
) {

  const geometry =
    new THREE.BoxGeometry(
      width,
      height,
      0.15
    );

  const window =
    new THREE.Mesh(
      geometry,
      glassMaterial
    );

  window.position.set(
    x,
    y,
    z
  );

  house.add(window);
}


// Ground-floor windows

createWindow(-5, 4, 5.05, 5, 4);
createWindow(2, 4, 5.05, 5, 4);
createWindow(7, 4, 5.05, 2, 4);


// Upper-floor windows

createWindow(1, 9.5, 4.05, 4, 3);
createWindow(6, 9.5, 4.05, 4, 3);


// -------------------------
// ROOF
// -------------------------

const roofGeometry =
  new THREE.BoxGeometry(
    14,
    0.5,
    9
  );

const roof =
  new THREE.Mesh(
    roofGeometry,
    darkMaterial
  );

roof.position.set(
  2,
  12.25,
  0
);

house.add(roof);


// -------------------------
// WOOD WALL
// -------------------------

const woodGeometry =
  new THREE.BoxGeometry(
    2,
    5,
    10.2
  );

const woodWall =
  new THREE.Mesh(
    woodGeometry,
    woodMaterial
  );

woodWall.position.set(
  -2,
  4,
  0
);

house.add(woodWall);


// -------------------------
// TERRACE
// -------------------------

const terraceGeometry =
  new THREE.BoxGeometry(
    10,
    0.3,
    5
  );

const terrace =
  new THREE.Mesh(
    terraceGeometry,
    darkMaterial
  );

terrace.position.set(
  1,
  7,
  7
);

house.add(terrace);


// -------------------------
// TERRACE GLASS RAILING
// -------------------------

for (let i = -4; i <= 6; i += 2) {

  createWindow(
    i,
    8,
    9.3,
    1.5,
    1.5
  );

}


// -------------------------
// DRIVEWAY
// -------------------------

const drivewayGeometry =
  new THREE.PlaneGeometry(
    8,
    30
  );

const drivewayMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x777777
  });

const driveway =
  new THREE.Mesh(
    drivewayGeometry,
    drivewayMaterial
  );

driveway.rotation.x =
  -Math.PI / 2;

driveway.position.set(
  12,
  0,
  12
);

scene.add(driveway);


// -------------------------
// TREES
// -------------------------

function createTree(x, z, scale = 1) {

  const trunkGeometry =
    new THREE.CylinderGeometry(
      0.3 * scale,
      0.5 * scale,
      3 * scale
    );

  const trunk =
    new THREE.Mesh(
      trunkGeometry,
      woodMaterial
    );

  trunk.position.set(
    x,
    1.5 * scale,
    z
  );

  scene.add(trunk);


  const leavesGeometry =
    new THREE.SphereGeometry(
      2.2 * scale,
      16,
      16
    );

  const leavesMaterial =
    new THREE.MeshStandardMaterial({
      color: 0x1f6b2a
    });

  const leaves =
    new THREE.Mesh(
      leavesGeometry,
      leavesMaterial
    );

  leaves.position.set(
    x,
    4 * scale,
    z
  );

  scene.add(leaves);
}


// Add trees around the property

createTree(-15, 2, 1.5);
createTree(-12, -10, 1);
createTree(15, -5, 1.4);
createTree(18, 8, 1);
createTree(-20, 10, 1.3);


// -------------------------
// CONTROLS
// -------------------------

const controls =
  new OrbitControls(
    camera,
    renderer.domElement
  );

controls.enableDamping = true;

controls.target.set(
  0,
  5,
  0
);


// -------------------------
// ANIMATION
// -------------------------

function animate() {

  requestAnimationFrame(
    animate
  );

  controls.update();

  renderer.render(
    scene,
    camera
  );
}

animate();


// -------------------------
// RESPONSIVE
// -------------------------

window.addEventListener(
  'resize',
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
</html>
